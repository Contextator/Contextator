# Contextator: one container with PostgreSQL 16 + pgvector and the app.
#
# Set DATABASE_URL in .env and the same container runs against a PostgreSQL you operate instead,
# starting none of its own (ADR-0069). Use the `-slim` image, which does not carry one at all, with
# docker-compose.slim.yml.
#
#   docker compose up -d          start (pulls contextator/contextator on first run)
#   docker compose logs -f        follow logs
#   docker compose down           stop and remove the container; data stays in the volumes below
#
# This pulls the published image rather than building it, so this one file works on its own —
# curled into an empty directory, with nothing else from the repository beside it. Pin a version
# with CONTEXTATOR_TAG instead of tracking latest (see .env.example). Building from source is still
# there, just not the default: layer docker-compose.build.yml on top to build instead of pull —
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Persistent data lives in Docker volumes named contextator-pgdata (database), contextator-models
# (downloaded embedding models) and contextator-data (uploaded files, git checkouts, Notion pulls).
# Rename them with CONTEXTATOR_*_VOLUME, or point CONTEXTATOR_*_PATH at absolute host directories
# instead (see .env.example).
name: contextator

services:
  contextator:
    image: contextator/contextator:${CONTEXTATOR_TAG:-latest}
    container_name: contextator
    restart: unless-stopped
    ports:
      # Published on the loopback interface only (ADR-0065). The dashboard and every MCP endpoint are
      # reachable at http://127.0.0.1:3444 on this machine and from nowhere else — a container started
      # on a laptop or an office server does not appear on the network it happens to be plugged into.
      # To publish it on the network deliberately, set CONTEXTATOR_BIND=0.0.0.0 in .env (see
      # .env.example), and put a TLS-terminating reverse proxy or a VPN in front of it.
      #
      # This is the *host* side of the mapping and nothing else: HOST inside the container stays
      # 0.0.0.0 below, because a process listening only on the container's own loopback is a process
      # Docker cannot forward a published port to at all.
      - "${CONTEXTATOR_BIND:-127.0.0.1}:${PORT:-3444}:3444"
    env_file:
      - path: .env
        required: false
    environment:
      # Container-specific values that must win over .env
      HOST: 0.0.0.0
      PORT: "3444"
      ALLOWED_DOC_ROOTS: /docs
      MODEL_CACHE_DIR: /app/.cache/models
      DATA_DIR: /data
      # Where the database is, and it is the one line that decides between the two topologies
      # (ADR-0069). Left empty — the shipped default, and what .env.example ships — the entrypoint
      # starts the PostgreSQL embedded in the image and points the app at it through the libpq PG*
      # variables; nothing below has to be provided and the pgdata volume is the database.
      #
      # Write a DATABASE_URL into .env and the container starts no PostgreSQL at all: it connects to
      # the server you named, the pgdata volume stays empty, and **that database's backups become
      # yours** — `docker exec contextator pg_dump …` reaches the embedded one and nothing else this
      # image ships reaches the other. The server needs to be PostgreSQL 16 or newer with pgvector
      # installed or installable by that role (the first start runs `CREATE EXTENSION IF NOT EXISTS
      # vector`); the database itself may be empty, the schema is created and migrated at startup.
      # For the app alone, with no PostgreSQL inside the image, see docker-compose.slim.yml.
      DATABASE_URL: ${DATABASE_URL:-}
      # Used when the embedded database cluster is created on the first start; unread on a DATABASE_URL
      # installation, where the credentials are in that URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contextator}
    volumes:
      # Database cluster. Created and left empty on a DATABASE_URL installation, where nothing writes
      # here — a mount cannot be made conditional, and an empty volume costs nothing.
      - ${CONTEXTATOR_PGDATA_PATH:-pgdata}:/var/lib/postgresql/data
      # Downloaded embedding models (re-downloadable, but ~500 MB)
      - ${CONTEXTATOR_MODELS_PATH:-models}:/app/.cache/models
      # Materialised sources: uploaded files, git checkouts, Notion pulls
      - ${CONTEXTATOR_DATA_PATH:-data}:/data
      # Your documentation. Create projects with paths like /docs/<subfolder>.
      - ${DOCS_HOST_PATH:-./docs}:/docs:ro
    # App shutdown + PostgreSQL fast shutdown
    stop_grace_period: 30s

volumes:
  pgdata:
    name: ${CONTEXTATOR_PGDATA_VOLUME:-contextator-pgdata}
  models:
    name: ${CONTEXTATOR_MODELS_VOLUME:-contextator-models}
  data:
    name: ${CONTEXTATOR_DATA_VOLUME:-contextator-data}

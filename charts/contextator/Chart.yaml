apiVersion: v2
name: contextator
description: >-
  Contextator — self-hosted documentation search server (MCP + REST + dashboard).
  Installs a single replica against an external PostgreSQL (pgvector) database.
  MCP sessions are held in memory and the indexer runs in-process, so this chart
  does not offer horizontal scaling.
type: application

# Chart version (SemVer2), independent of the application's version (ADR-0092). Bump it in the
# same change that touches anything under charts/contextator/ — CI fails a chart change that
# leaves it as it was:
#   - patch: a fix that changes no value;
#   - minor: a new value;
#   - major: a removed or renamed value, or a value the schema newly rejects.
# A published version is never overwritten: the release workflow's chart-releaser step skips a
# version that already has a release. 1.0.0 is the first version with the strict values schema
# (values the permissive 0.1.0 accepted are now rejected) and the first one published.
version: 1.0.0

# The application release this chart was last tested with (ADR-0092). It is not an image default:
# values.yaml `image.tag` has none and must be set to a `-slim` tag.
appVersion: "0.2.0"

kubeVersion: ">=1.24.0-0"

keywords:
  - documentation
  - search
  - mcp
  - rag
  - pgvector

home: https://github.com/Contextator/Contextator
sources:
  - https://github.com/Contextator/Contextator

maintainers:
  - name: Contextator
    url: https://github.com/Contextator/Contextator

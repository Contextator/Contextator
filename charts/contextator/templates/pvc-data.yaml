{{- if and .Values.persistence.data.enabled (not .Values.persistence.data.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "contextator.fullname" . }}-data
  labels:
    {{- include "contextator.labels" . | nindent 4 }}
  {{- if or .Values.persistence.retainOnUninstall .Values.persistence.data.annotations }}
  annotations:
    {{- if .Values.persistence.retainOnUninstall }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.data.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.data.accessModes | nindent 4 }}
  {{- if .Values.persistence.data.storageClassName }}
  storageClassName: {{ .Values.persistence.data.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
{{- end }}

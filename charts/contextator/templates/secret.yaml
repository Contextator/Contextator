{{- include "contextator.requireDatabase" . -}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "contextator.databaseSecretName" . }}
  labels:
    {{- include "contextator.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "contextator: database.url must not be empty when database.existingSecret is unset (ADR-0069)" .Values.database.url | quote }}
{{- end }}
---
{{- if not .Values.secretKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "contextator.secretKeySecretName" . }}
  labels:
    {{- include "contextator.labels" . | nindent 4 }}
  annotations:
    # helm.sh/resource-policy is deliberately NOT "keep": on `helm uninstall` this key goes away
    # with the release, same as database.url would. See values.yaml secretKey comment.
    contextator.io/note: >-
      Auto-generated on first install. `helm upgrade` reuses this Secret's existing value via
      `lookup` rather than regenerating it, so it stays stable across upgrades. It is not
      regenerated by `helm template` / `helm install --dry-run`, where `lookup` always returns
      nothing — those render a fresh random value each time, which is expected for a dry run.
type: Opaque
data:
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "contextator.secretKeySecretName" .)) }}
  {{- if .Values.secretKey.value }}
  SECRET_KEY: {{ .Values.secretKey.value | b64enc }}
  {{- else if and $existing $existing.data (index $existing.data "SECRET_KEY") }}
  SECRET_KEY: {{ index $existing.data "SECRET_KEY" }}
  {{- else }}
  SECRET_KEY: {{ randAlphaNum 44 | b64enc }}
  {{- end }}
{{- end }}

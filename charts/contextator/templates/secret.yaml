{{- include "contextator.requireDatabase" . -}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "contextator.databaseSecretName" . }}
  labels:
    {{- include "contextator.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "contextator: database.url must not be empty when database.existingSecret is unset (ADR-0069)" .Values.database.url | quote }}
{{- end }}
---
{{- if not .Values.secretKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "contextator.secretKeySecretName" . }}
  labels:
    {{- include "contextator.labels" . | nindent 4 }}
  {{- /*
    helm.sh/resource-policy is deliberately NOT "keep": on `helm uninstall` this key goes away with
    the release, same as database.url would. See values.yaml secretKey comment. The note is only
    written when the chart generates the key; with secretKey.value there is nothing to regenerate.
  */}}
  {{- if not .Values.secretKey.value }}
  annotations:
    contextator.io/note: >-
      Generated by the chart because secretKey.existingSecret and secretKey.value are unset.
      `helm install` and `helm upgrade` against the cluster reuse the live value through `lookup`.
      Anything that renders the chart without cluster access (Argo CD and other GitOps tools,
      `helm template | kubectl apply`) gets an empty `lookup` and so a NEW random key on every
      render; applying it overwrites the live key, and stored source credentials can no longer be
      decrypted. For those workflows set secretKey.existingSecret to a Secret you manage (chart
      README, "GitOps and `helm template`").
  {{- end }}
type: Opaque
data:
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "contextator.secretKeySecretName" .)) }}
  {{- if .Values.secretKey.value }}
  SECRET_KEY: {{ .Values.secretKey.value | b64enc }}
  {{- else if and $existing $existing.data (index $existing.data "SECRET_KEY") }}
  SECRET_KEY: {{ index $existing.data "SECRET_KEY" }}
  {{- else }}
  SECRET_KEY: {{ randAlphaNum 44 | b64enc }}
  {{- end }}
{{- end }}

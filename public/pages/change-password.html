<form class="gate-card" id="change-form" novalidate>
  <span class="gate-icon" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path><path d="M12 15v2"></path></svg>
  </span>
  <h1>Choose a new password</h1>
  <p class="muted">
    The temporary password your administrator gave you has to be replaced before you can use the dashboard. Your other
    sessions are signed out when you save, so whoever else saw that password loses it.
  </p>
  <label class="field">
    <span class="field-label">Temporary password</span>
    <input name="currentPassword" type="password" autocomplete="current-password" required />
  </label>
  <label class="field">
    <span class="field-label">New password</span>
    <input name="newPassword" type="password" autocomplete="new-password" required />
    <span class="field-hint">At least 12 characters, and not your username.</span>
  </label>
  <label class="field">
    <span class="field-label">Repeat new password</span>
    <input name="confirmPassword" type="password" autocomplete="new-password" required />
  </label>
  <p id="change-error" class="form-error" role="alert" hidden></p>
  <button type="submit" class="primary block" id="change-submit">Save and continue</button>
  <p class="field-hint center"><a href="#" id="change-signout">Sign out instead</a></p>
</form>

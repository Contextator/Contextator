<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}} · Contextator</title>
    <meta name="description" content="{{description}}" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230E6F66'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='white' font-family='Georgia,serif'>C</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="logo" aria-hidden="true">C</span>
        <span class="brand-name">Contextator</span>
        <span class="brand-tag">MCP documentation server</span>
      </a>
      <a class="btn ghost" href="/">Back to dashboard</a>
    </header>

    <main class="page">
      <article class="page-doc">
        {{content}}
      </article>
    </main>

    <footer class="footer">
      <p class="footer-left">
        Copyright &copy; {{year}} <a href="https://contextator.com" target="_blank" rel="noopener" title="contextator">Contextator</a>
        v{{version}} is a <a href="https://tunedness.com" target="_blank" rel="noopener">Tunedness</a> production.
      </p>
      <nav class="footer-links" aria-label="Product and legal pages">
        {{nav}}
      </nav>
    </footer>
  </body>
</html>

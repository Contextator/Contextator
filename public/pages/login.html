<form class="gate-card" id="login-form" novalidate>
  <span class="gate-icon" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
  </span>
  <h1>Sign in</h1>
  <p class="muted">This dashboard belongs to a Contextator instance. Use the account its operator gave you.</p>
  <label class="field">
    <span class="field-label">Username</span>
    <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required />
  </label>
  <label class="field">
    <span class="field-label">Password</span>
    <input name="password" type="password" autocomplete="current-password" required />
  </label>
  <p id="login-error" class="form-error" role="alert" hidden></p>
  <button type="submit" class="primary block" id="login-submit">Sign in</button>
  <p class="field-hint center" id="login-setup-hint" hidden>
    No account exists yet. <a href="/setup">Complete the first-run setup</a> with the code from the server log.
  </p>
  <p class="field-hint center">The MCP endpoints under <code>/mcp/*</code> are not affected by this sign-in.</p>
</form>

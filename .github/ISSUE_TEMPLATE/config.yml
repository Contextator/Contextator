# A security problem filed as an issue is public the moment it is filed, so the chooser offers the
# private route before anything else, and there is no blank issue to bypass the forms with.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/Contextator/Contextator/security/advisories/new
    about: Report it privately. Do not open a public issue.
  - name: How to contribute
    url: https://github.com/Contextator/Contextator/blob/main/CONTRIBUTING.md
    about: Running it, the checks a change has to pass, and the licence grant.

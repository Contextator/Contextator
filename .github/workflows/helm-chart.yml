# Lints and renders the Helm chart at charts/contextator/ and checks its version policy — it does not
# publish anything. Publishing is the release workflow's `chart` job (chart-releaser to the gh-pages
# Helm repository, ADR-0092), which runs only for a `v*` tag; this workflow guards every chart change
# before that: the chart lints, renders, rejects values its strict schema does not allow, and carries a
# bumped `version`.
name: Helm chart

on:
  pull_request:
    paths:
      - "charts/contextator/**"
      - ".github/workflows/helm-chart.yml"
  push:
    branches: [main]
    paths:
      - "charts/contextator/**"
      - ".github/workflows/helm-chart.yml"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-template:
    name: helm lint and helm template
    runs-on: ubuntu-latest
    # An explicit `shell: bash` is what makes Actions run each step as `bash -eo pipefail` (the
    # implicit default is `bash -e`, no pipefail); each step also says `set -euo pipefail` itself so
    # it behaves the same when pasted into a local shell.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      # database.url and image.tag are both required (ADR-0078): the chart's own _helpers.tpl and
      # deployment.yaml call `fail`/`required` without them. `helm lint` itself doesn't fail when that
      # fires (Helm renders best-effort for lint purposes), but it does print the message as noise, so
      # both values are set here too, for a clean pass against the chart's actual installable
      # configuration. Neither is a real value; nothing here talks to a database or pulls an image.
      - name: helm lint
        run: |
          set -euo pipefail
          helm lint charts/contextator \
            --set image.tag="ci-test" \
            --set database.url="postgres://user:pass@db.example.internal:5432/contextator"

      - name: helm template (database.url and image.tag set)
        run: |
          set -euo pipefail
          helm template ctx charts/contextator \
            --set image.tag="ci-test" \
            --set database.url="postgres://user:pass@db.example.internal:5432/contextator"

      # The install-time guard from ADR-0078 is itself part of the chart's contract: no DATABASE_URL,
      # no rendered Pod. `helm template` must fail here, so the step inverts the exit code rather than
      # letting a passing render go unnoticed. image.tag is supplied so the render fails for the
      # database.url reason under test, not because of the separate image.tag guard below.
      - name: helm template fails without database.url or database.existingSecret
        run: |
          set -euo pipefail
          if output=$(helm template ctx charts/contextator --set image.tag="ci-test" 2>&1); then
            echo "helm template succeeded with no database.* value set — expected it to fail (ADR-0078)."
            exit 1
          fi
          if ! grep -qi "database.url" <<< "$output"; then
            echo "helm template failed, but not for the expected database.url reason:"
            echo "$output"
            exit 1
          fi

      # image.tag has no default (ADR-0078): falling back to the chart's appVersion would silently
      # deploy the full image, i.e. the wrong (embedded-Postgres) topology — the slim build is only
      # published under the `-slim` tags. Mirrors the database.url guard above — image.tag is the one
      # left unset here.
      - name: helm template fails without image.tag
        run: |
          set -euo pipefail
          if output=$(helm template ctx charts/contextator \
              --set database.url="postgres://user:pass@db.example.internal:5432/contextator" 2>&1); then
            echo "helm template succeeded with no image.tag set — expected it to fail (ADR-0078)."
            exit 1
          fi
          if ! grep -qi "image.tag" <<< "$output"; then
            echo "helm template failed, but not for the expected image.tag reason:"
            echo "$output"
            exit 1
          fi

      # replicaCount is deliberately not an exposed value (ADR-0078, "Replicas" in the chart README) —
      # asserting `replicas: 1` here is a regression guard against ever adding a way to raise it; the
      # schema step below checks that setting replicaCount is rejected.
      - name: Exactly one replica in the rendered Deployment
        run: |
          set -euo pipefail
          rendered=$(helm template ctx charts/contextator \
            --set image.tag="ci-test" \
            --set database.url="postgres://user:pass@db.example.internal:5432/contextator" \
            --show-only templates/deployment.yaml)
          grep -E '^\s*replicas:\s*1\s*$' <<< "$rendered"

      # values.schema.json is strict (ADR-0092): an unknown key at the root or nested, or a value of the
      # wrong type, must fail the render and name the offending key — nothing is ignored silently.
      # replicaCount is one of the unknown keys: the chart does not offer it at all (ADR-0078), so it
      # is rejected rather than ignored. Each case sets image.tag and database.url, so the render can
      # only fail for the schema reason under test; the grep checks that the error names that key.
      # The patterns match both Helm 3's error wording (`service.port: Invalid type`) and Helm 4's
      # (`at '/service/port': got string`), so a local run with either reads the same.
      - name: The values schema rejects unknown keys and wrong types (ADR-0092)
        run: |
          set -euo pipefail
          check() {
            local expect=$1; shift
            if output=$(helm template ctx charts/contextator \
                --set image.tag="ci-test" \
                --set database.url="postgres://user:pass@db.example.internal:5432/contextator" \
                "$@" 2>&1); then
              echo "helm template accepted $* — expected the values schema to reject it (ADR-0092)."
              exit 1
            fi
            if ! grep -qE -- "$expect" <<< "$output"; then
              echo "helm template failed for $*, but the error does not name '$expect':"
              echo "$output"
              exit 1
            fi
          }
          check 'foo' --set foo=bar                                   # unknown key at the root
          check 'tagg' --set image.tagg=x                             # unknown key, nested
          check 'replicaCount' --set-string replicaCount=1            # not offered (ADR-0078)
          check 'service[./]port' --set-string service.port=80        # wrong type: string for integer
          check 'pullPolicy' --set image.pullPolicy=Sometimes         # outside the enum
          # Host names only (ADR-0088): src/config.ts refuses a port or a URL at startup, so the schema
          # refuses them at install instead of leaving a crash-looping Pod.
          check 'confluenceAllowedHosts' --set 'config.confluenceAllowedHosts={wiki.corp.example:8443}'
          check 'confluenceAllowedHosts' --set 'config.confluenceAllowedHosts={10.0.4.12:8443}'
          check 'confluenceAllowedHosts' --set 'config.confluenceAllowedHosts={https://wiki.corp.example}'

      # TRUST_PROXY must never be inferred from ingress.enabled (ADR-0060, ADR-0078) — it is only ever
      # rendered when config.trustProxy is set explicitly. This regression-tests the tur 2 fix against
      # the one values combination most likely to tempt an "ingress implies a proxy" shortcut. The
      # render is its own command, outside any `if`, so a render error fails the step instead of
      # reading as "no match"; the second render is the control that the grep can match at all.
      - name: TRUST_PROXY is not inferred from ingress.enabled
        run: |
          set -euo pipefail
          cat > /tmp/helm-chart-ci-ingress.yaml <<'EOF'
          ingress:
            enabled: true
            hosts:
              - host: ctx.example.internal
                paths:
                  - path: /
                    pathType: Prefix
          EOF
          rendered=$(helm template ctx charts/contextator \
            --set image.tag="ci-test" \
            --set database.url="postgres://user:pass@db.example.internal:5432/contextator" \
            -f /tmp/helm-chart-ci-ingress.yaml \
            --show-only templates/deployment.yaml)
          if grep -q 'name: TRUST_PROXY' <<< "$rendered"; then
            echo "TRUST_PROXY was rendered with ingress.enabled=true and no config.trustProxy set — expected it to stay unset (ADR-0060, ADR-0078)."
            exit 1
          fi
          control=$(helm template ctx charts/contextator \
            --set image.tag="ci-test" \
            --set database.url="postgres://user:pass@db.example.internal:5432/contextator" \
            -f /tmp/helm-chart-ci-ingress.yaml \
            --set config.trustProxy=loopback \
            --show-only templates/deployment.yaml)
          if ! grep -q 'name: TRUST_PROXY' <<< "$control"; then
            echo "TRUST_PROXY was not rendered even with config.trustProxy set — the check above cannot see it."
            exit 1
          fi

      # The two typed `config` keys that map onto application env vars: config.confluenceAllowedHosts is
      # joined with "," into CONFLUENCE_ALLOWED_HOSTS (the app splits it on ","), and
      # config.mcpStructuredOutput=true renders MCP_STRUCTURED_OUTPUT as the string "1". With the
      # defaults, and with mcpStructuredOutput=false, neither variable is rendered at all. `env_value`
      # prints the `value:` line that follows `- name: <var>`, so a lost `join` (a rendered list) or a
      # changed flag value fails here. The set-values render doubles as the control that the
      # "not rendered" greps can match.
      - name: Typed config keys render CONFLUENCE_ALLOWED_HOSTS and MCP_STRUCTURED_OUTPUT
        run: |
          set -euo pipefail
          render() {
            helm template ctx charts/contextator \
              --set image.tag="ci-test" \
              --set database.url="postgres://user:pass@db.example.internal:5432/contextator" \
              "$@" \
              --show-only templates/deployment.yaml
          }
          env_value() {
            awk -v var="$1" '
              found { sub(/^[ \t]*value:[ \t]*/, ""); print; exit }
              { line = $0; sub(/^[ \t]*-[ \t]*name:[ \t]*/, "", line); if (line != $0 && line == var) found = 1 }
            ' <<< "$rendered"
          }
          assert_unset() {
            local label=$1 var; shift
            rendered=$(render "$@")
            for var in CONFLUENCE_ALLOWED_HOSTS MCP_STRUCTURED_OUTPUT; do
              if grep -qE "name: ${var}\$" <<< "$rendered"; then
                echo "$var was rendered with $label — expected it to stay unset."
                exit 1
              fi
            done
          }
          assert_unset 'the defaults'
          assert_unset 'mcpStructuredOutput=false' --set config.mcpStructuredOutput=false
          rendered=$(render \
            --set 'config.confluenceAllowedHosts={wiki.corp.example,10.0.4.12,fd00::12}' \
            --set config.mcpStructuredOutput=true)
          got=$(env_value CONFLUENCE_ALLOWED_HOSTS)
          if [[ "$got" != '"wiki.corp.example,10.0.4.12,fd00::12"' ]]; then
            echo "CONFLUENCE_ALLOWED_HOSTS rendered as ${got:-<missing>}; expected \"wiki.corp.example,10.0.4.12,fd00::12\"."
            exit 1
          fi
          got=$(env_value MCP_STRUCTURED_OUTPUT)
          if [[ "$got" != '"1"' ]]; then
            echo "MCP_STRUCTURED_OUTPUT rendered as ${got:-<missing>}; expected \"1\"."
            exit 1
          fi

      # Both PVCs default to helm.sh/resource-policy: keep (ADR-0078, persistence.retainOnUninstall
      # defaults to true) — `helm uninstall` must not silently delete stored data or models.
      - name: Both PVCs default to helm.sh/resource-policy keep
        run: |
          set -euo pipefail
          for tmpl in templates/pvc-data.yaml templates/pvc-models.yaml; do
            rendered=$(helm template ctx charts/contextator \
              --set image.tag="ci-test" \
              --set database.url="postgres://user:pass@db.example.internal:5432/contextator" \
              --show-only "$tmpl")
            grep -q 'helm.sh/resource-policy: keep' <<< "$rendered" || {
                echo "$tmpl did not render helm.sh/resource-policy: keep with default values."
                exit 1
              }
          done

      # Liveness is TCP and never touches the database; readiness and startup call GET /api/health,
      # which answers 503 while the database is down — that is what takes a DB-down Pod out of the
      # Service without restarting it (ADR-0078, acceptance criteria 7). A probe that swaps type in
      # either direction is a regression: HTTP liveness crash-loops the Pod during a database outage,
      # TCP readiness keeps sending it traffic. `block` prints the lines nested under one key, so
      # each probe is judged on its own lines and not on its neighbours'.
      - name: Probes — liveness is TCP, readiness and startup are GET /api/health
        run: |
          set -euo pipefail
          rendered=$(helm template ctx charts/contextator \
            --set image.tag="ci-test" \
            --set database.url="postgres://user:pass@db.example.internal:5432/contextator" \
            --show-only templates/deployment.yaml)
          block() {
            awk -v key="$1:" '
              !on { line = $0; sub(/^[ \t]*/, "", line); if (line == key) { on = 1; ind = length($0) - length(line); next } }
              on  { line = $0; sub(/^[ \t]*/, "", line); if (line != "" && length($0) - length(line) <= ind) exit; print }
            ' <<< "$rendered"
          }
          liveness=$(block livenessProbe)
          if ! grep -qE '^\s*tcpSocket:\s*$' <<< "$liveness" || grep -q 'httpGet:' <<< "$liveness"; then
            echo "livenessProbe is not a bare tcpSocket check:"; echo "${liveness:-<missing>}"; exit 1
          fi
          for probe in readinessProbe startupProbe; do
            body=$(block "$probe")
            if ! grep -qE '^\s*httpGet:\s*$' <<< "$body" \
              || ! grep -qE '^\s*path:\s*/api/health\s*$' <<< "$body" \
              || grep -q 'tcpSocket:' <<< "$body"; then
              echo "$probe is not GET /api/health:"; echo "${body:-<missing>}"; exit 1
            fi
          done

      # DATA_DIR is /data in the image, and uploaded files survive a Pod restart only because the data
      # PVC is mounted there (ADR-0078, acceptance criterion 5). `items` folds each YAML list item under
      # volumeMounts/volumes onto one line, so a name and its mountPath are matched as one entry.
      # Checked twice: with the chart's own PVC, and with persistence.data.existingClaim, which must
      # replace the claim name and nothing else.
      - name: The data PVC is mounted at /data
        run: |
          set -euo pipefail
          block() {
            awk -v key="$1:" '
              !on { line = $0; sub(/^[ \t]*/, "", line); if (line == key) { on = 1; ind = length($0) - length(line); next } }
              on  { line = $0; sub(/^[ \t]*/, "", line); if (line != "" && length($0) - length(line) <= ind) exit; print }
            ' <<< "$rendered"
          }
          items() {
            awk '/^[ \t]*- / { if (item != "") print item; item = "" } { sub(/^[ \t]*(- )?/, ""); item = item " " $0 } END { if (item != "") print item }'
          }
          for case in "ctx-contextator-data|" "existing-data-claim|existing-data-claim"; do
            claim=${case%%|*}
            existing=${case#*|}
            rendered=$(helm template ctx charts/contextator \
              --set image.tag="ci-test" \
              --set database.url="postgres://user:pass@db.example.internal:5432/contextator" \
              --set persistence.data.existingClaim="$existing" \
              --show-only templates/deployment.yaml)
            mounts=$(block volumeMounts | items)
            volumes=$(block volumes | items)
            grep -E '(^| )name: data( |$)' <<< "$mounts" | grep -qE '(^| )mountPath: /data( |$)' || {
              echo "no volumeMount named data at /data (existingClaim='$existing'):"; echo "${mounts:-<missing>}"; exit 1; }
            grep -E '(^| )name: data( |$)' <<< "$volumes" | grep -qE "(^| )claimName: $claim( |\$)" || {
              echo "volume data does not claim $claim (existingClaim='$existing'):"; echo "${volumes:-<missing>}"; exit 1; }
          done

  # ADR-0092: `version` is bumped in the same change that touches the chart, and a published version
  # is never overwritten — chart-releaser skips a version that already has a release, so a chart change
  # without a bump would never reach the Helm repository. The base is the pull request's base commit,
  # or the commit the push moved main from. The version must be higher than the base's, by SemVer
  # order; which part to bump (patch, minor, major) is the author's call and Chart.yaml says how.
  version-bump:
    name: Chart version bumped with the chart
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Chart.yaml version moves with any chart change
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No base commit to compare against ('$BASE_SHA'); nothing to check."
            exit 0
          fi
          if git diff --quiet "$BASE_SHA" HEAD -- charts/contextator; then
            echo "charts/contextator/ unchanged since $BASE_SHA."
            exit 0
          fi
          version() { sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' | head -n 1; }
          if ! git cat-file -e "$BASE_SHA:charts/contextator/Chart.yaml" 2>/dev/null; then
            echo "charts/contextator/Chart.yaml is new since $BASE_SHA; nothing to compare."
            exit 0
          fi
          old=$(git show "$BASE_SHA:charts/contextator/Chart.yaml" | version)
          new=$(version < charts/contextator/Chart.yaml)
          if [[ -z "$new" ]]; then
            echo "Could not read version from charts/contextator/Chart.yaml."
            exit 1
          fi
          highest=$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)
          if [[ "$new" == "$old" || "$highest" != "$new" ]]; then
            echo "charts/contextator/ changed since $BASE_SHA, but Chart.yaml version went from '$old' to '$new'."
            echo "Bump it in the same change (ADR-0092): patch for a fix, minor for a new value, major for a"
            echo "removed or renamed value or a value the schema newly rejects."
            exit 1
          fi
          echo "Chart version $old -> $new."

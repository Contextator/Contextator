# The door on the licence grant. ADR-0025 put a commercial licence beside AGPL-3.0-or-later, and that
# offer holds only while the copyright is held in full: one outside contribution merged without a grant
# removes the ability to licence that code commercially, permanently, and reverting the commit does not
# undo it. ADR-0030 wrote the condition down and left the enforcing to a machine that did not exist.
# This is that machine, and since ADR-0061 it is ours.
#
# It used to be `contributor-assistant/github-action`, pinned. That Action was archived in March 2026 —
# read-only, thirty-eight open issues, an `action.yml` still declaring `node20` that will never be
# corrected, and no maintained fork (the most-starred has four stars and none is on node24). A legal
# position that cannot be undone was being held by a frozen dependency, so ADR-0061 moved the logic here
# and the decisions into `scripts/cla/`, where they are unit-tested.
#
# **There is no logic in this file.** It decides when a runner starts, and it hands the script two tokens
# and nothing else; the script reads the event as JSON from `GITHUB_EVENT_PATH`. That is deliberate: a
# pull request title, a branch name and a comment body are all text a stranger chooses, and none of it
# reaches a shell or a `${{ }}` expression here.
name: CLA

on:
  # Both triggers are load-bearing and neither is enough alone. `pull_request_target` runs the check
  # against the base repository (a fork's `GITHUB_TOKEN` could not write a comment or re-run anything),
  # and `issue_comment` is how a signature arrives.
  #
  # `reopened` is not decoration: without it, a pull request closed and reopened keeps whatever the last
  # run on that head commit concluded, and nothing re-evaluates it.
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

# Two signatures arriving in the same minute are two runs that both read the signature file and both
# write it back, and the second one's write is against a blob SHA that has moved. `scripts/cla/run.ts`
# handles that properly — it re-reads and appends again — and this serialises the common case so the
# retry is the exception rather than the norm. `cancel-in-progress: false` because a cancelled run is a
# signature that was never recorded.
concurrency:
  group: "cla-${{ github.event.issue.number || github.event.pull_request.number }}"
  cancel-in-progress: false

jobs:
  # **This job's name is `Licence grant`, it is registered as a required status check on `main` with
  # `enforce_admins` on, and it must not be renamed here alone.** A required check that stops being
  # reported does not fail open — it never reports at all, every pull request stays pending forever and
  # nothing can be merged. Changing it means changing the branch protection in the same breath.
  #
  # The condition is on the job and not on a step, so an ordinary issue comment never allocates a
  # runner. It deliberately does *not* exclude the `closed` action: a job skipped by its own `if` is
  # reported as **skipped**, and GitHub counts a skipped job as a *passing* required check. A run that
  # concludes nothing must therefore never produce a check run by this name — so on every
  # `pull_request_target`, `closed` included, this job runs and the script judges for real. Locking a
  # merged thread is the other job's business and it carries a different name for exactly this reason.
  #
  # The comment body is not tested here. It was, under the old Action, and the cost was a guard in YAML
  # that had to agree with a matcher in TypeScript about what counts as a signature; they disagree
  # silently and the contributor is the one who finds out. The script is the only matcher now, and every
  # comment on a pull request gets a run that genuinely verifies.
  cla:
    name: Licence grant
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    permissions:
      # Re-running the pull request's own workflow run once a signature lands — the step that turns the
      # check green without asking the contributor to push an empty commit. This is the job's own
      # `GITHUB_TOKEN`, not the signatures token, which is why that one can stay narrow.
      actions: write
      # `read`, not `write`: the signatures are in a different repository, reached with the other token.
      # Nothing here writes to this repository.
      contents: read
      # Posting the "please sign" comment and reading the thread the signature arrives in.
      pull-requests: write
    env:
      # Mirrors ci.yml. onnxruntime-node's postinstall fetches optional GPU binaries; nothing in this
      # job embeds anything, and a licence gate has no business downloading a CUDA runtime.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      # `pull_request_target` checks out the **base** repository at the base commit, which is this
      # repository's own code — `github.event.pull_request.head.sha` and `head.ref` appear nowhere in
      # this file and must not. A checkout of the fork's head here would hand a stranger the
      # write-scoped tokens above and then run their `npm ci`.
      # **Pinned to commits, and `ci.yml`'s `@v7` is not a precedent this file follows.** The Action that
      # used to run here was pinned to a SHA on a stated principle — a tag is a name its owner can move,
      # and the gate on the project's licensing position is not delegated to a third party's next commit.
      # That principle did not stop applying because the third party changed to GitHub: this job holds
      # `CLA_SIGNATURES_TOKEN` and `actions: write`, which is a blast radius `ci.yml`'s jobs do not have.
      # These are the commits `v7.0.1` and `v7.0.0` point at; move them by resolving the tag again, and
      # read the diff first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job talks to git. Leaving a credential in `.git/config` for the length of
          # the run buys nothing and is one more thing a step could be tricked into using.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The same floor as ci.yml and the image: ADR-0056. Unlike the Action this replaced, which
          # declared a runtime GitHub had already stopped honouring, this number is ours to move.
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check the licence grant
        run: npx tsx scripts/cla/main.ts
        env:
          # This repository's side: the commits of the pull request, the thread, and the re-run.
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          # A **fine-grained** token scoped to `Contextator/cla-signatures` alone, with Contents: Read
          # and write and nothing else — verified to be refused 403 against this repository. That is the
          # whole of what it does: read and write one JSON file in one repository.
          #
          # Fine-grained tokens expire. When it does, this step fails, the check goes red and nothing
          # merges — the failure lands on the safe side, but put the expiry in a calendar anyway.
          CLA_SIGNATURES_TOKEN: "${{ secrets.CLA_SIGNATURES_TOKEN }}"

  # Locking is hygiene, not evidence: the signature of record is the row in `signatures/v1/cla.json`, and
  # `issues.lock` only stops *new* comments — it does not stop anyone deleting the comment they left. The
  # thread is locked so that a merged pull request stops being an editable surface, and for no stronger
  # reason than that.
  #
  # It is a separate job with a different name because the Action this replaced, given a `closed` event
  # and locking switched on, locked and returned **without checking anything** — a green job that
  # verified nothing. Under the name branch protection requires, that is a hole. Under this name it is
  # what it says it is. `merged == true` keeps it off a pull request the author closed to tidy up, who
  # would otherwise come back to a thread they can no longer sign in.
  lock:
    name: Lock a merged thread
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Locking a pull request conversation goes through the issues API, and `pull-requests: write`
      # alone does not reach it.
      issues: write
    steps:
      # No checkout and no install: `gh` is on the runner. The two values interpolated are GitHub's own
      # — this repository's full name and an integer — and neither is text a contributor writes.
      - name: Lock the conversation
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REPOSITORY: "${{ github.repository }}"
          NUMBER: "${{ github.event.pull_request.number }}"
        run: gh api --silent --method PUT "repos/$REPOSITORY/issues/$NUMBER/lock" -f lock_reason=resolved

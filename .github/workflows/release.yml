# The other half of the sentence in `ci.yml`'s `image` job: "publishing is a later phase, and a
# workflow that can push is a workflow that has to be trusted to." `ci.yml` builds and throws away on
# every pull request, with no registry credential anywhere near it. This workflow is the one place
# `DOCKERHUB_USERNAME` and `DOCKERHUB_TOKEN` are read, and it only runs on a `v*` tag — something a
# maintainer pushed on purpose, not a branch a pull request can point at.
name: Release

on:
  push:
    tags: ['v*']

# Two tags cannot land on the same ref, so this only matters for the same tag pushed twice (a
# re-tag after deleting the first one). `cancel-in-progress: false`, not the `ci.yml` default: a
# cancelled `docker push` can leave a manifest list half-written on Docker Hub, and a queued rerun
# is cheap where an inconsistent published tag is not.
concurrency:
  group: "release-${{ github.ref_name }}"
  cancel-in-progress: false

# Docker Hub credentials are handed to actions as inputs, never as `GITHUB_TOKEN` — this token
# reaches nothing Docker Hub owns. `packages: write` (the GitHub Container Registry permission)
# is not requested because nothing here talks to GHCR.
permissions:
  contents: read

jobs:
  # Runs before anything is built or pushed, and needs nothing but the checkout: no registry, no
  # Helm, no remote lookup. ADR-0092: `appVersion` is the application release the chart was tested
  # with, and a published chart version is never overwritten, so a stale `appVersion` would be
  # permanent. Checking it here instead of in `chart` means a mismatch stops the release while
  # nothing — no image, no chart — has been published, rather than after the image is already out.
  chart-preflight:
    name: Check the chart's appVersion before anything is published
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The previous tag and the history to diff against it; a full fetch brings the tags along.
          fetch-depth: 0

      # Checked only when chart-releaser will publish, i.e. when charts/contextator changed since the
      # previous tag (the same `git describe HEAD~` and diff cr.sh uses in `chart`); a release that
      # does not touch the chart does not have to touch it. `appVersion` is read from Chart.yaml
      # directly, so no Helm has to be installed. Re-running cannot fix a mismatch: the run checks the
      # tagged commit, so the fix is a new commit and a tag on it.
      - name: Require appVersion to match the tag when the chart is published
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 HEAD~ 2>/dev/null || git rev-list --max-parents=0 --first-parent HEAD)
          if git diff --quiet "$previous" -- charts/contextator; then
            echo "charts/contextator unchanged since $previous: nothing will be published, appVersion not checked."
            exit 0
          fi
          app_version=$(sed -n 's/^appVersion:[[:space:]]*//p' charts/contextator/Chart.yaml | tr -d "\"'")
          if [ "$app_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error file=charts/contextator/Chart.yaml,title=appVersion does not match the tag::charts/contextator/Chart.yaml has appVersion \"$app_version\", but this release is ${GITHUB_REF_NAME} and the chart changed since $previous, so it would be published now, permanently. Nothing has been published: no image, no chart. Set appVersion to the version of the tag you release under (\"${GITHUB_REF_NAME#v}\" for this one), raise version as for any chart change, commit it, and push a tag on that new commit; ${GITHUB_REF_NAME} published nothing, so it may be deleted and pushed again there. Re-running this run does not help: it checks the same commit."
            exit 1
          fi
          echo "appVersion $app_version matches ${GITHUB_REF_NAME}."

  # One job, not two. It used to be `verify` building amd64 and asserting against it, then a
  # separate `publish` job building both architectures over again and pushing that — connected only
  # by `cache-from: type=gha`, and a remote cache is allowed to evict between two jobs, and
  # `Dockerfile`'s base images (`node:22-bookworm-slim`, `pgvector/pgvector:pg16`) are mutable tags
  # that can move between them too. Either one meant the image actually pushed to Docker Hub was
  # never, itself, the image the assertions below ran against — only one built the same way.
  #
  # A single job with a single `docker/setup-buildx-action` builder closes that gap structurally
  # rather than by hoping a cache hits: the amd64 layers the assertions exercise are produced once,
  # sit in that builder's own local cache for the rest of this job, and the multi-arch push below
  # reuses them by content address — no eviction window exists because nothing leaves this runner in
  # between. `cache-from`/`cache-to: type=gha` stays on both builds regardless, but only as a
  # cross-run accelerator (a cold builder pulling what `ci.yml` or a previous release already built);
  # it is no longer what carries the verified layers into the pushed image — the shared builder is.
  publish:
    name: Verify, then build and push contextator/contextator
    # Nothing is built or pushed until the chart preflight has passed.
    needs: chart-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `cache-to: type=gha` writes to the Actions cache, which the read-only default above does not
      # reach — the same reason `ci.yml`'s `image` job carries it.
      actions: write
    steps:
      - uses: actions/checkout@v7

      # Registered before either build: the amd64-only build below does not need it, but the
      # multi-arch build later in this same job does, and setting it up once up front is simpler than
      # arguing about whether a later step still needs QEMU registered from an earlier one.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # amd64 only, loaded into the local daemon rather than pushed: the three checks below run
      # inside it, and nothing here has registry credentials yet — that arrives only once this image
      # has been proven, further down.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: contextator:verify
          cache-from: type=gha

      # `v0.1.0` publishing code whose `package.json` says `0.2.0` is a released image whose version
      # nobody can trust, and it would not be caught by looking at the checked-out repository alone —
      # the question is what actually ended up in the image. So this reads `package.json` the same way
      # the running server would, from `/app/package.json` inside the image that was just built,
      # against the tag that is about to publish it.
      - name: Tag matches the version baked into the image
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          image_version=$(docker run --rm --entrypoint node contextator:verify -p "require('/app/package.json').version")
          echo "tag: ${GITHUB_REF_NAME} (${tag_version})  image: ${image_version}"
          if [ "$tag_version" != "$image_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the package.json version (${image_version}) inside the image it built"
            exit 1
          fi

      # The two assertions `ci.yml`'s `image` job runs on every pull request, run again here, verbatim.
      # Both guard defects that broke silently before (ADR-0032, ADR-0033), and a defect reaching a
      # published image is more expensive to notice and to undo than the same defect reaching a pull
      # request — so the tag they gate on is the one place they cannot be skipped. Because this is one
      # job, a failure on either step below stops the job here: the push step further down is never
      # reached, on this image or any other.
      - name: The migrations are inside the image
        run: |
          set -o pipefail
          output=$(docker run --rm --entrypoint sh contextator:verify -c 'ls /app/drizzle /app/drizzle/meta')
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qF '0000_baseline.sql'
          printf '%s\n' "$output" | grep -qF '_journal.json'

      - name: The recovery tool runs inside the image
        run: |
          set -o pipefail
          output=$(docker run --rm --entrypoint sh contextator:verify -c 'npm run reset-password 2>&1' || true)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qF 'Usage: npm run reset-password -- <username>'

      # The second image, verified on the same builder and before the same credentials arrive
      # (ADR-0069). It shares the `build` stage with the one above, so what is built here is one more
      # set of runtime layers over work this job has already done.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: slim
          platforms: linux/amd64
          push: false
          load: true
          tags: contextator:verify-slim
          cache-from: type=gha

      # `slim` carries no PostgreSQL, so the one thing it must never do is start anyway and wait.
      # A published image that does that is a support case per installation; this is the gate the
      # tag cannot be pushed past.
      - name: The slim image refuses to start without a DATABASE_URL
        run: |
          set -euo pipefail
          if docker run --rm contextator:verify-slim > refusal.log 2>&1; then
            cat refusal.log
            echo "::error::the slim image started with no DATABASE_URL instead of refusing to"
            exit 1
          fi
          cat refusal.log
          grep -qF 'no database configured' refusal.log
          grep -qF 'DATABASE_URL=postgres://' refusal.log

      # The three assertions above, made against the other image: same version, same migrations,
      # same recovery tool. They are one step here rather than three because the /app tree they read
      # is copied from the same build stage — what is being checked is that the copy happened.
      - name: The slim image carries the same version, migrations and recovery tool
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          image_version=$(docker run --rm --entrypoint node contextator:verify-slim -p "require('/app/package.json').version")
          echo "tag: ${GITHUB_REF_NAME} (${tag_version})  slim image: ${image_version}"
          [ "$tag_version" = "$image_version" ]
          output=$(docker run --rm --entrypoint sh contextator:verify-slim -c 'ls /app/drizzle /app/drizzle/meta; npm run reset-password 2>&1' || true)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qF '0000_baseline.sql'
          printf '%s\n' "$output" | grep -qF '_journal.json'
          printf '%s\n' "$output" | grep -qF 'Usage: npm run reset-password -- <username>'

      # Only reached once every check above has passed. `docker/login-action` is pinned to a commit
      # and not a tag for the same reason `cla.yml` pins the actions in its own token-holding job: it
      # is handed `DOCKERHUB_TOKEN`, a personal access token scoped read/write/delete against the
      # `contextator` Docker Hub organisation, and a tag is a name its owner can move. Resolve `v4.6.0`
      # again to move this, and read the diff first.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      # Turns one tag into the set of tags the image is actually published under. `latest` is excluded
      # on a pre-release (`v0.2.0-rc.1` has a `-` in `github.ref_name`) so that publishing a release
      # candidate never moves the tag every plain `docker pull contextator/contextator` resolves to.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: contextator/contextator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # The same three rules with `-slim` on the end of every one of them (ADR-0069): `0.1.0-slim`,
      # `0.1-slim`, `latest-slim`. `suffix` with `onlatest=true` is what puts it on the raw `latest`
      # tag as well as on the two semver ones — without it `latest` would publish the slim image
      # under the tag a plain `docker pull contextator/contextator` resolves to, which is the one
      # mistake in this file that would be felt by every installation at once.
      #
      # A pre-release is excluded from `latest-slim` by the same `contains(github.ref_name, '-')`
      # condition, evaluated once and reused, so the two tag sets cannot drift apart on that either.
      - name: Docker metadata (slim)
        id: meta-slim
        uses: docker/metadata-action@v6
        with:
          images: contextator/contextator
          flavor: |
            suffix=-slim,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Both architectures here too. A target that only ever built on the runner's own amd64 would
      # hide an arm64 defect until somebody on an arm64 host pulled it — and this stage installs its
      # own `gosu` and `tini` from Debian, which is exactly the kind of thing that is per-architecture.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: "${{ steps.meta-slim.outputs.tags }}"
          labels: "${{ steps.meta-slim.outputs.labels }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        env:
          # Interpolated into the environment rather than straight into the script, matching the
          # standard `cla.yml` sets: a value this workflow does not fully control (here, computed by
          # an action rather than typed by a stranger) still does not reach a shell through `${{ }}`.
          TAGS: "${{ steps.meta.outputs.tags }}"
          SLIM_TAGS: "${{ steps.meta-slim.outputs.tags }}"
        run: |
          {
            echo "## Published \`contextator/contextator\`"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            printf '%s\n' "$SLIM_TAGS"
            echo '```'
            echo
            echo 'Pull it:'
            echo '```bash'
            echo "docker pull contextator/contextator:${GITHUB_REF_NAME#v}"
            echo "docker pull contextator/contextator:${GITHUB_REF_NAME#v}-slim   # no embedded PostgreSQL; needs DATABASE_URL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The Helm chart's gh-pages repository (ADR-0092): `helm repo add contextator
  # https://contextator.github.io/Contextator`. Runs only here, so only for a `v*` tag a maintainer
  # pushed, and only after `publish` — the chart needs the `-slim` image that job pushes, and a chart
  # published for a release whose image failed its checks would point at nothing.
  #
  # chart-releaser packages a chart only when it changed since the previous tag (`git describe --tags
  # HEAD~`); a release that leaves charts/ alone publishes nothing and this job passes. A changed chart
  # is uploaded as a GitHub release (and tag) named `contextator-<chart version>`, then the updated
  # index.yaml is committed to the `gh-pages` branch. `skip_existing` leaves a version that already
  # has a release alone, so a published version is never overwritten. `mark_as_latest: false` keeps
  # that chart release from displacing the application's `v*` release as the repository's "Latest".
  #
  # One-time setup, in this order: create the `gh-pages` branch, turn GitHub Pages on for it, then cut
  # the tag. chart-releaser creates the chart's release before it writes the index, so without the
  # branch it would leave a released-but-unindexed version behind, and the next release — chart
  # unchanged — would find nothing to do and never index it; the first step below refuses to start
  # instead. chart-releaser never looks at Pages: with the branch present and Pages off, this job
  # passes and the repository URL answers 404.
  #
  # `appVersion` is not checked here: `chart-preflight` checks it before `publish` starts, so a
  # mismatch fails the run with nothing published and is fixed by a new commit and tag, never by a
  # re-run. What can still fail here is infrastructure — the missing branch, the network, the upload
  # or the index push. For those, fix the cause and use "Re-run failed jobs" on the same run:
  # `skip_existing` skips the upload that already happened and the index is written; a later release
  # will not do it for you, since it only looks at chart changes since this tag. The image is
  # unaffected either way.
  chart:
    name: Publish the Helm chart to gh-pages
    needs: publish
    runs-on: ubuntu-latest
    # The only job in this workflow that writes to the repository: a GitHub release per chart version
    # and a commit to `gh-pages`. Nothing else is granted.
    permissions:
      contents: write
    steps:
      # All three actions below are pinned to a commit, not a tag, for the same reason `cla.yml` and
      # `docker/login-action` above are: this job's `GITHUB_TOKEN` can write to the repository, and a
      # tag is a name its owner can move. `setup-helm` is included because it is handed the token by
      # default. Resolve the tag again to move a pin, and read the diff first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # chart-releaser finds the changed charts by diffing against the previous tag.
          fetch-depth: 0

      - name: Require the gh-pages branch
        run: |
          set -euo pipefail
          rc=0
          git ls-remote --exit-code --heads origin gh-pages >/dev/null || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=No gh-pages branch::The gh-pages branch does not exist, so the chart cannot be indexed. Create it (an empty orphan branch is enough), turn GitHub Pages on for it, then use \"Re-run failed jobs\" on this run. The chart has not been published; the image has, and is not affected."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error title=gh-pages lookup failed::git ls-remote exited $rc while looking for the gh-pages branch; re-run this job."
            exit 1
          fi

      - name: Configure the git identity for the gh-pages commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.14.4

      # chart-releaser-action downloads the `cr` binary with curl and runs it unverified, in a job whose
      # token can write to the repository; a release asset can be replaced by its owner just as a tag
      # can be moved. So `cr` is installed here instead, and only after its archive matches the sha256
      # published in chart-releaser v1.7.0's own checksums.txt (read 2026-09-25). The action is pointed
      # at this directory via `install_dir`; cr.sh skips its own download when the directory exists,
      # and this step fails before creating it when the checksum does not match. Moving `CR_VERSION`
      # means reading that release's checksums.txt and updating `CR_SHA256` in the same change.
      - name: Install chart-releaser (checksum-verified)
        env:
          CR_VERSION: v1.7.0
          CR_SHA256: 121a16d4e38b348decb977b8257d4bddab3323681c1819bab4870603138087cf
        run: |
          set -euo pipefail
          archive="chart-releaser_${CR_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/helm/chart-releaser/releases/download/${CR_VERSION}/${archive}"
          echo "${CR_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/cr"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/cr"
          rm -f "$RUNNER_TEMP/$archive"
          test -x "$RUNNER_TEMP/cr/cr"

      - uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          version: v1.7.0
          install_dir: ${{ runner.temp }}/cr
          charts_dir: charts
          skip_existing: true
          mark_as_latest: false
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

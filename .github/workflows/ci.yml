# The gate every pull request has to pass: lint, typecheck, the unit suite, the integration suite
# against a real PostgreSQL, and proof that the image still builds. See ADR-0029, ADR-0031, NFR-15 and
# NFR-16 in the specification repository.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The `eval` job is the reason this is here: an operator comparing two retrieval configurations
  # wants to run the measurement against `main` on demand, not by pushing something.
  workflow_dispatch:

# A second push to the same branch makes the first one's answer worthless, so stop paying for it.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    env:
      # Mirrors the Dockerfile. onnxruntime-node's postinstall fetches optional GPU binaries that
      # nothing here uses; without this the install pulls a CUDA runtime to run unit tests.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The image runs node:22-bookworm-slim; CI matches it rather than the engines floor of 20.
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Biome ships as a platform-specific native binary, which is why this job is pinned to
      # ubuntu-latest rather than run across a matrix.
      - run: npm run lint

      # `src/db/schema.ts` and `drizzle/*.sql` are two halves of one statement (ADR-0033) and
      # nothing in the compiler or in Biome notices when only one of them is edited. This is the
      # guard, and it is its own step rather than part of `npm run lint` so that "the schema drifted"
      # never reads as "the formatter is unhappy" — ADR-0029 gave that script one job.
      - name: The migrations and the schema still agree
        run: npm run db:check

      # Both tsconfigs: the one that builds dist/, and the one that covers test/ and scripts/.
      - run: npm run typecheck

      - run: npm test

  integration:
    name: Integration tests against PostgreSQL
    runs-on: ubuntu-latest
    env:
      # Same reason as above: nothing in this suite embeds anything, and the vectors it searches with
      # are written by hand (ADR-0031), so there is no model and no GPU runtime to fetch.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # No `services:` block on purpose. ubuntu-latest already runs a Docker daemon, and testcontainers
      # starts pgvector/pgvector:pg16 itself, waits for it and stops it afterwards — which is the same
      # code path a contributor runs locally. A service container would work only here, and the two
      # paths would drift until the one that is harder to run stopped being run (ADR-0031).
      - run: npm run test:integration

  image:
    name: Build the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # type=gha writes to the Actions cache, which needs more than the read-only default above.
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Built and thrown away. There are no registry credentials here on purpose: publishing is
          # a later phase, and a workflow that can push is a workflow that has to be trusted to.
          push: false
          # Loaded into the local daemon so the step below can run something inside it.
          load: true
          tags: contextator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The migrations are the other thing that can drop out of an image silently, and the failure
      # mode is worse than the recovery tool's: not a command nobody reaches for, but every
      # containerised upgrade dying at boot with "Can't find meta/_journal.json". `drizzle/` was in
      # `.dockerignore` until this change, so this is a defect that existed before the feature did
      # (ADR-0033). Listing is enough here — unlike the tool below, there is no loader and no import
      # graph to get wrong, and the integration suite runs the migrations themselves.
      - name: The migrations are inside the image
        run: |
          set -o pipefail
          output=$(docker run --rm --entrypoint sh contextator:ci -c 'ls /app/drizzle /app/drizzle/meta')
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qF '0000_baseline.sql'
          printf '%s\n' "$output" | grep -qF '_journal.json'

      # The recovery tool dropped out of the image once already, silently, and nothing noticed until
      # somebody needed it (ADR-0032). Checking that the file is present would not have caught the
      # half of that defect that mattered — it has no loader and its imports point into src/ — so
      # this runs the thing. With no argument it prints its usage and exits 2, which it can only
      # reach through tsx, through every import in scripts/reset-password.ts, and back.
      - name: The recovery tool runs inside the image
        run: |
          set -o pipefail
          output=$(docker run --rm --entrypoint sh contextator:ci -c 'npm run reset-password 2>&1' || true)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qF 'Usage: npm run reset-password -- <username>'

  eval:
    name: Retrieval evaluation
    runs-on: ubuntu-latest
    env:
      # Same reason as the jobs above, and the same evidence: the Dockerfile installs with this set and
      # the image it produces embeds locally on the CPU. The postinstall fetches GPU binaries; the CPU
      # ones ship in the package.
      ONNXRUNTIME_NODE_INSTALL: skip
      # Pinned rather than left to the default in `src/config.ts`, for two different reasons. The model
      # and the dtype are half of `provider.id` and therefore half of what the numbers mean, so a CI
      # figure and a laptop figure are only the same figure when both are stated. And the cache key
      # below is derived from them: a faster dtype is a different download and must not be a cache hit.
      EMBEDDING_MODEL: Xenova/multilingual-e5-small
      EMBEDDING_DTYPE: fp32
      # The floors this job fails on, and the reason they are two numbers rather than one (ADR-0044).
      # Each is the measured figure less one question, rounded down to the nearest half point, so one
      # question may regress and two may not. They are written here rather than defaulted inside
      # `scripts/eval.ts` because an operator sweeping a setting on a laptop is not running a gate, and
      # because a floor that can be changed without changing a file that says what it was measured at is
      # a floor that drifts. `eval/BASELINE.md` carries both numbers and the run they came from; the two
      # must move together.
      #
      # They moved once, here, and the reason is the denominator rather than retrieval. ROADMAP.md Item
      # 12 grew the cross-lingual slice from ten questions to thirty — twenty questions this retriever
      # is known to be bad at, written from the corpus and kept when they failed — so the set is
      # eighty-four questions where it was sixty-four, and 69.0 % / 66.7 % is what the *same* retrieval
      # measures over it. The sixty-four that predate that change still measure 87.5 % / 84.4 %, every
      # question at the same rank with the same score to six decimal places. That control is in
      # `eval/BASELINE.md` and it is what makes a lowered floor readable as arithmetic instead of as a
      # regression somebody waved through.
      MIN_RECALL5: "0.675"
      MIN_HEADING5: "0.650"
    steps:
      - uses: actions/checkout@v7
        with:
          # The filter below diffs against the pull request's base commit, which the default shallow
          # checkout does not have.
          fetch-depth: 0

      # Path filters in `on:` are workflow-wide, and this workflow's other three jobs must run on every
      # pull request. So the filter lives here, in the one job it applies to: a documentation change
      # should not pay for a 470 MB model download and a container, and a retrieval change must.
      - name: Does this change touch retrieval?
        id: relevant
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD)
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(src/services/|eval/|scripts/eval)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo 'No retrieval evaluation: this change touches neither `src/services/**`, `eval/**` nor `scripts/eval.ts`.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v7
        if: steps.relevant.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      # Keyed on the model and the dtype, and deliberately not on package-lock.json: the contents of
      # this directory do not depend on the lockfile, and keying it there would throw away a
      # several-hundred-megabyte download on every dependency bump.
      - name: Cache the embedding model
        if: steps.relevant.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: "models-${{ env.EMBEDDING_MODEL }}-${{ env.EMBEDDING_DTYPE }}"

      - run: npm ci --no-audit --no-fund
        if: steps.relevant.outputs.run == 'true'

      # No database is handed to it, so it starts pgvector/pgvector:pg16 through the same testcontainers
      # harness the integration suite uses, carves a database out of it and drops both at the end
      # (ADR-0034). The numbers go to the run summary, where they can be read without downloading
      # anything, and the JSON goes to an artifact so two runs can be diffed.
      #
      # With the two floors it is a gate: a run that measures below either exits 2 and this step fails,
      # having already written the summary and the report — so the numbers survive the failure, which is
      # the difference between a gate somebody debugs and a gate somebody deletes (ADR-0044). It is
      # guarded by the same condition as every step above it, so a pull request the filter decided is
      # not about retrieval never reaches the gate: the job does nothing and is green, exactly as it was
      # when it only reported.
      - name: Score the golden set, and fail below the floor
        if: steps.relevant.outputs.run == 'true'
        run: npm run eval -- --markdown="$GITHUB_STEP_SUMMARY" --json=eval-report.json --min-recall5="$MIN_RECALL5" --min-heading5="$MIN_HEADING5"

      # `always()` and not the step condition alone: the report is most worth having on the run where
      # the gate failed. Still inside the path filter, so a skipped job uploads nothing.
      - uses: actions/upload-artifact@v4
        if: always() && steps.relevant.outputs.run == 'true'
        with:
          name: eval-report
          path: eval-report.json

# This job gates. It reported and did not gate for the whole of Phase 1, on the stated understanding that
# it would become a gate once there was a floor worth failing a build over (ADR-0034); Phase 1 set one and
# ADR-0044 turns it on. What a red build here means is narrow and worth stating: retrieval got worse on
# twenty-six pages and eighty-four questions, which is the only corpus this repository can speak for. A
# change that means to move the floor moves `eval/BASELINE.md` and the two numbers above in the same
# commit, and says in its message why the new figure is the right one.

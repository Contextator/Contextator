# The gate every pull request has to pass: lint, typecheck, the unit suite, the integration suite
# against a real PostgreSQL, and proof that the image still builds. See ADR-0029, ADR-0031, NFR-15 and
# NFR-16 in the specification repository.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first one's answer worthless, so stop paying for it.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    env:
      # Mirrors the Dockerfile. onnxruntime-node's postinstall fetches optional GPU binaries that
      # nothing here uses; without this the install pulls a CUDA runtime to run unit tests.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The image runs node:22-bookworm-slim; CI matches it rather than the engines floor of 20.
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Biome ships as a platform-specific native binary, which is why this job is pinned to
      # ubuntu-latest rather than run across a matrix.
      - run: npm run lint

      # `src/db/schema.ts` and `drizzle/*.sql` are two halves of one statement (ADR-0033) and
      # nothing in the compiler or in Biome notices when only one of them is edited. This is the
      # guard, and it is its own step rather than part of `npm run lint` so that "the schema drifted"
      # never reads as "the formatter is unhappy" — ADR-0029 gave that script one job.
      - name: The migrations and the schema still agree
        run: npm run db:check

      # Both tsconfigs: the one that builds dist/, and the one that covers test/ and scripts/.
      - run: npm run typecheck

      - run: npm test

  integration:
    name: Integration tests against PostgreSQL
    runs-on: ubuntu-latest
    env:
      # Same reason as above: nothing in this suite embeds anything, and the vectors it searches with
      # are written by hand (ADR-0031), so there is no model and no GPU runtime to fetch.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # No `services:` block on purpose. ubuntu-latest already runs a Docker daemon, and testcontainers
      # starts pgvector/pgvector:pg16 itself, waits for it and stops it afterwards — which is the same
      # code path a contributor runs locally. A service container would work only here, and the two
      # paths would drift until the one that is harder to run stopped being run (ADR-0031).
      - run: npm run test:integration

  image:
    name: Build the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # type=gha writes to the Actions cache, which needs more than the read-only default above.
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Built and thrown away. There are no registry credentials here on purpose: publishing is
          # a later phase, and a workflow that can push is a workflow that has to be trusted to.
          push: false
          # Loaded into the local daemon so the step below can run something inside it.
          load: true
          tags: contextator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The migrations are the other thing that can drop out of an image silently, and the failure
      # mode is worse than the recovery tool's: not a command nobody reaches for, but every
      # containerised upgrade dying at boot with "Can't find meta/_journal.json". `drizzle/` was in
      # `.dockerignore` until this change, so this is a defect that existed before the feature did
      # (ADR-0033). Listing is enough here — unlike the tool below, there is no loader and no import
      # graph to get wrong, and the integration suite runs the migrations themselves.
      - name: The migrations are inside the image
        run: |
          set -o pipefail
          output=$(docker run --rm --entrypoint sh contextator:ci -c 'ls /app/drizzle /app/drizzle/meta')
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qF '0000_baseline.sql'
          printf '%s\n' "$output" | grep -qF '_journal.json'

      # The recovery tool dropped out of the image once already, silently, and nothing noticed until
      # somebody needed it (ADR-0032). Checking that the file is present would not have caught the
      # half of that defect that mattered — it has no loader and its imports point into src/ — so
      # this runs the thing. With no argument it prints its usage and exits 2, which it can only
      # reach through tsx, through every import in scripts/reset-password.ts, and back.
      - name: The recovery tool runs inside the image
        run: |
          set -o pipefail
          output=$(docker run --rm --entrypoint sh contextator:ci -c 'npm run reset-password 2>&1' || true)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qF 'Usage: npm run reset-password -- <username>'

# One more job belongs here and is deliberately absent rather than stubbed: `eval`, scoring retrieval
# quality against a fixed question set. An empty job that always reports success is a lie told in a
# status check; the absence of a check is the more honest signal until the check exists. `integration`
# was the other one, and it is above now.

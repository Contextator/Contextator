version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      dependencies-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # ADR-0119 keeps the OpenTelemetry packages on one line (2.11 / 0.222), and they only
      # resolve when they move together, so only patch releases are proposed automatically.
      - dependency-name: "@opentelemetry/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]

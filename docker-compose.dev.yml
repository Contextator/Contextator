# PostgreSQL + pgvector only, for running the app on the host with `npm run dev`:
#
#   docker compose -f docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://contextator:contextator@localhost:5432/contextator
name: contextator-dev

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: contextator-dev-db
    environment:
      POSTGRES_USER: contextator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contextator}
      POSTGRES_DB: contextator
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # -h localhost forces TCP so the check does not pass during initdb's socket-only phase
      test: ["CMD-SHELL", "pg_isready -h localhost -U contextator -d contextator"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
    name: contextator-dev-pgdata

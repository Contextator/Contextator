<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ingestion architecture</title>
</head>
<body>
  <h1>Ingestion architecture</h1>
  <p>The diagram below is the only place the queue names are written down.</p>
  <svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img">
    <title>Ingestion pipeline overview</title>
    <desc>Webhooks land on the intake gateway, which hands each batch to the reconciliation worker.</desc>
    <defs>
      <linearGradient id="fill"><stop offset="0" stop-color="#ddeeff"/><stop offset="1" stop-color="#aaccee"/></linearGradient>
    </defs>
    <g class="node">
      <rect x="10" y="60" width="180" height="60" fill="url(#fill)"/>
      <text x="100" y="95" text-anchor="middle">Intake gateway</text>
    </g>
    <path d="M190 90 L 420 90" stroke="#333" marker-end="url(#arrow)"/>
    <g class="node">
      <rect x="420" y="60" width="200" height="60" fill="url(#fill)"/>
      <text x="520" y="85" text-anchor="middle"><tspan x="520">Reconciliation</tspan> <tspan x="520" dy="16">worker</tspan></text>
    </g>
    <text x="305" y="80" font-size="11">queue: ledger-settlement-7</text>
  </svg>
  <p>Retries are described in the runbook.</p>
</body>
</html>
